services:
  nemotoken-web:
    image: nginx:1.27-alpine
    container_name: nemotoken-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-80}:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx-nemotoken.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nemotoken-backend:
        condition: service_healthy
    networks:
      - nemotoken-network

  nemotoken-backend:
    build:
      context: ../TransferStation
      dockerfile: deploy/Dockerfile
    container_name: nemotoken-backend
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - SERVER_FRONTEND_URL=${SERVER_FRONTEND_URL:-https://nemotoken.online}
      - RUN_MODE=${RUN_MODE:-standard}
      - DATABASE_HOST=nemotoken-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-nemotoken}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-nemotoken}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=nemotoken-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@nemotoken.online}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      - TZ=${TZ:-Asia/Hong_Kong}
    depends_on:
      nemotoken-postgres:
        condition: service_healthy
      nemotoken-redis:
        condition: service_healthy
    networks:
      - nemotoken-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nemotoken-postgres:
    image: postgres:18-alpine
    container_name: nemotoken-postgres
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nemotoken}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-nemotoken}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Hong_Kong}
    networks:
      - nemotoken-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemotoken} -d ${POSTGRES_DB:-nemotoken}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nemotoken-redis:
    image: redis:8-alpine
    container_name: nemotoken-redis
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - nemotoken-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  nemotoken-network:
    driver: bridge
